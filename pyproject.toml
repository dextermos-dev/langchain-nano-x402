[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-nano-x402"
version = "0.1.2"
description = "LangChain integration tool for autonomous Nano x402 resource purchasing with local payment guards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "BountyHunter AI", email = "dextermos@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core==1.7.2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
agent = [
    "langchain==1.4.7",
    "langchain-openai>=0.3.0",
]
dev = [
    "pytest>=8.0",
    "pynacl>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
